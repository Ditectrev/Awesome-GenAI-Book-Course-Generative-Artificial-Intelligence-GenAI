## Introduction to Generative AI (GenAI) <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

---

### What is Generative AI (GenAI)? <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* Generation, not lookup <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* A model is not a product <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Mix providers: [OpenAI](https://openai.com/), [Groq](https://groq.com/), [Ollama](https://ollama.com/) <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Products: [ChatGPT](https://chatgpt.com/), [Claude](https://claude.ai/), [Gemini](https://gemini.google.com/), [Le Chat](https://chat.mistral.ai/), [DeepSeek](https://www.deepseek.com/) <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

#### Tokens, context windows, and why they matter on the job <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* A token is the chunk the model actually sees <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Billed and limited in tokens, not words <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Count with the provider tokenizer, not `len(text)` <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* [tiktoken](https://github.com/openai/tiktoken) and the [OpenAI tokenizer](https://platform.openai.com/tokenizer) <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* [Claude token counting](https://docs.anthropic.com/en/docs/build-with-claude/token-counting) <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* [Gemini API](https://ai.google.dev/gemini-api/docs) count methods <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

#### Tokens, context windows, and why they matter on the job <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* Context window = system + retrieval + tools + history + reply <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* A bigger window is not free <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Durable rules in a system prompt, not every user turn <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Large documents behind retrieval, not pasted whole <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Measure prompt tokens and completion tokens separately <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Count tokens before you ship the prompt <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

#### Models, products, and open-weight checkpoints <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* A **model** is the trained network and tokenizer <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Hosted models: [OpenAI Platform](https://platform.openai.com/), [Anthropic Console](https://console.anthropic.com/), [Gemini API](https://ai.google.dev/gemini-api/docs), [Mistral AI](https://mistral.ai/), [DeepSeek API](https://api-docs.deepseek.com/) <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* A **product** wraps a model: [ChatGPT](https://chatgpt.com/), [Claude](https://claude.ai/), [Gemini](https://gemini.google.com/) <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* An **open-weight checkpoint** is a file of weights, usually from the [Hugging Face Hub](https://huggingface.co/models) <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Run with [Ollama](https://ollama.com/), [llama.cpp](https://github.com/ggml-org/llama.cpp), [vLLM](https://github.com/vllm-project/vllm), [Transformers](https://github.com/huggingface/transformers) <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Open weights are not automatically open source; read the [model card](https://huggingface.co/docs/hub/en/model-cards) <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Write down model id, product or API, and whether you can host it <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

#### Text, image, audio, and multimodal generation in practice <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* Text first: [OpenAI](https://platform.openai.com/docs/guides/text), [Anthropic](https://docs.anthropic.com/en/docs/build-with-claude/text-generation), [Gemini](https://ai.google.dev/gemini-api/docs), [Mistral](https://docs.mistral.ai/), [DeepSeek](https://api-docs.deepseek.com/) <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Images: [ChatGPT](https://chatgpt.com/), [OpenAI Images API](https://platform.openai.com/docs/guides/images), [Gemini image generation](https://ai.google.dev/gemini-api/docs/image-generation) <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Local images: [Diffusers](https://github.com/huggingface/diffusers), [ComfyUI](https://github.com/Comfy-Org/ComfyUI), [AUTOMATIC1111 WebUI](https://github.com/AUTOMATIC1111/stable-diffusion-webui), [Flux](https://blackforestlabs.ai/) <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Audio: [OpenAI Whisper](https://github.com/openai/whisper), [whisper.cpp](https://github.com/ggml-org/whisper.cpp), later [LiveKit Agents](https://github.com/livekit/agents) <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Multimodal: screenshot, PDF page, or photo plus a question <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Start with text; add other modalities as a second loop <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

### How generative models are trained <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* You do not train a frontier model to ship <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Stack: machine learning, pretraining, instruction tuning, preference data <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Fine-tuning stays under Shipping, Cost, and Operations <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

#### Machine learning basics you need on the job <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* Train versus serve: production is almost always inference <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Loss and generalization: demo success is not your tickets <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Supervision: next-token, instruction-response pairs, rankings <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Training is a build pipeline you rarely run <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

#### Pretraining, datasets, and data licenses <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* Pretraining is next-token prediction on a huge mix <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Read dataset and license on the [Hugging Face model card](https://huggingface.co/docs/hub/en/model-cards) <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Hosted terms: [OpenAI](https://openai.com/policies/row-privacy-policy/), [Anthropic](https://www.anthropic.com/legal/privacy), [Google Gemini](https://ai.google.dev/gemini-api/terms), [Mistral](https://mistral.ai/terms/), [DeepSeek](https://www.deepseek.com/) <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Do not train on customer tickets without a written right <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* If you are unsure, retrieval beats training <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

#### Hugging Face Datasets as a catalog <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* [Hugging Face Datasets](https://github.com/huggingface/datasets) library and [Hub catalog](https://huggingface.co/datasets) <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Find what a checkpoint already saw, or a close proxy <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Load an eval set before you invent one <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Read the license on the dataset card, not only the model card <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Prefer streaming and documented schemas <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* You need it for evals and adapters, not for a hosted API call <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

#### Instruction tuning, RLHF, and preference data <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* Instruction-tuned models follow "summarize this" and "return JSON" <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Preference data: rank answer A versus answer B <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* [RLHF](https://openai.com/index/instruction-following/) and [Constitutional AI](https://www.anthropic.com/research/constitutional-ai-harmlessness-from-ai-feedback) <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Open tooling: [Hugging Face TRL](https://github.com/huggingface/trl) <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Chat APIs are already instruction-tuned <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Preference tuning is not a knowledge-cutoff refresh <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

### When to use a hosted API versus a local model <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* Who runs the GPUs, who sees the bytes, who you page at 2 a.m. <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Hosted API: a URL, a key, and a bill <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Local: [Ollama](https://ollama.com/), [llama.cpp](https://github.com/ggml-org/llama.cpp), [Open WebUI](https://github.com/open-webui/open-webui), [vLLM](https://github.com/vllm-project/vllm) <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Default to a hosted API for the first working loop <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

#### Cost, privacy, latency, and lock-in tradeoffs <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* Cost: APIs per token; local in GPUs, electricity, and people <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Privacy: read training and retention terms; local is not a privacy program by itself <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Latency: measure time-to-first-token; [Groq](https://groq.com/) as a fast hosted path <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Lock-in: OpenAI-compatible servers with [Ollama](https://ollama.com/), [vLLM](https://github.com/vllm-project/vllm), [llama.cpp](https://github.com/ggml-org/llama.cpp) <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Prototype on a hosted API, freeze an interface, then decide <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

### One interface over many providers <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* Pick one adapter, not all three <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

#### LiteLLM as a unified API <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* [LiteLLM](https://github.com/BerriAI/litellm) and [LiteLLM docs](https://docs.litellm.ai/docs/) <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* OpenAI-shaped call; model string names the vendor <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Same smoke-test prompt, two model strings <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Proxy belongs in Shipping; the library is enough today <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

#### Vercel AI SDK for app UIs <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* [Vercel AI SDK](https://github.com/vercel/ai) and [ai-sdk.dev](https://ai-sdk.dev/) <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Stream tokens into a web app <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Keys stay on the server, never in the browser <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Skip it until a native non-streaming call already works <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

#### OpenRouter as a model router <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* [OpenRouter](https://openrouter.ai/) and [OpenRouter docs](https://openrouter.ai/docs) <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* One key, many origin models, OpenAI-compatible client <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Cap spend on OpenRouter itself <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Not a substitute for learning one native SDK <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

### Secrets, logging, and a daily working loop <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* Key in the environment <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Request logged in a form you can diff <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

#### Environment variables, never paste keys into chats <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* SDKs read `OPENAI_API_KEY`, `ANTHROPIC_API_KEY`, and friends <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Never paste a live key into [ChatGPT](https://chatgpt.com/), [Claude](https://claude.ai/), or a committed prompt file <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

## Local Models You Can Run Today <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* Weights on disk, plus a server you start <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

### Install a local runner in under an hour <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

#### Ollama for everyday local chat and APIs <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* Install from [Ollama](https://ollama.com/download) <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

* `ollama list` shows it; the server stays on port 11434 <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* OpenAI client: base URL `http://localhost:11434/v1/`, any non-empty `api_key` <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Local Ollama ignores that key <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

#### Ollama for everyday local chat and APIs <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* Same smoke-test prompt; `model` is the tag you pulled <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* [OpenAI compatibility](https://docs.ollama.com/api/openai-compatibility): chat, JSON, tools <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* `tool_choice` and logprobs are outside that subset <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* `ollama signin` and `OLLAMA_API_KEY` are the cloud path <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

#### llama.cpp and GGUF when you need control <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* `llama cli -hf` runs a Hub GGUF <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* `llama serve -hf` opens the OpenAI-compatible server <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* [Server README](https://github.com/ggml-org/llama.cpp/blob/master/tools/server/README.md): port 8080 <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

#### Open WebUI as a local ChatGPT-style front end <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* [Open WebUI](https://github.com/open-webui/open-webui) is a chat UI, not a model <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

* Chats live in the data volume; local weights do not erase that log <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

## Prompting, Context, and System Instructions <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* The smoke test grows from "pong" into a contract <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Rules, task, evidence, and output shape <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* The prompt lives in a file, not in a chat <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

### Write instructions the model can follow <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* The model sees the text, in order, inside the window <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* If a colleague would hesitate, the model will too <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* One change per rerun <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

#### System prompts <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* Durable rules: job, constraints, output shape, missing input <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* [Anthropic](https://docs.anthropic.com/en/docs/build-with-claude/prompt-engineering/system-prompts): top-level `system` <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* [Gemini](https://ai.google.dev/gemini-api/docs/text-generation): `system_instruction` <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* [OpenAI](https://developers.openai.com/api/reference/resources/chat): `developer` message or Responses `instructions` <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Short enough to read in one screen; prove the missing-input rule with a fixture <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

#### System, developer, and user roles <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* User text is the task and the document; treat customer text as data <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Assistant turns are history, unless you meant a few-shot example <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* [OpenAI Model Spec](https://model-spec.openai.com/): developer instructions outrank user text <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* From o1 on, `developer` replaces `system` <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Local templates only honor a system slot when the checkpoint has one <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

#### Splitting work, delimiters, and output contracts <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* One request, one job <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Name the fence and wrap the payload: XML tags or Markdown headings, one style <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Long document first, question last; rules stay in the instruction slot <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* The contract is the assertion in words, then in the smoke test <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

#### Few-shot examples that help instead of confuse <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* A few input/output pairs when the format is easier to show <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Every example must obey the contract <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Cover an edge you actually hit <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* A pile of examples is an eval set, not a prompt <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

### JSON prompts <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* The instruction itself is an object: task, rules, output, input <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* "Reply in JSON" is a separate decision about the answer <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

#### Write the prompt as JSON, not only the answer <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* Named fields diff cleanly <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Keep `task` and `rules` stable; vary `input` from a fixture <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Commit fake input; keep customer text and secrets out of Git <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Parse the answer with a strict parser <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

#### When JSON prompts are enough versus structured outputs <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* Enough when a person could check a small object and a retry is acceptable <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Move on when a program must trust types <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* JSON mode stops preamble; it does not enforce your schema <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Next chapter: Structured Outputs and Tool Calling <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

### Context windows as a budget <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* Instructions, history, documents, tools, and the reply share one window <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Log prompt tokens on every smoke test <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

#### What to put in the prompt versus retrieve later <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* Keep rules, this task, and the one document that must be seen whole <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* A wiki, a pile of PDFs, or a repo dump waits for retrieval or tools <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Stable instructions first so a prompt cache can reuse the prefix <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* [Anthropic prompt caching](https://docs.anthropic.com/en/docs/build-with-claude/prompt-caching): tools, then system, then messages <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

#### Summaries, memory notes, and stale context <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* Trim history on purpose; confirm the system prompt is still in the request <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* A memory note is decisions, names, and constraints, with a date <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* A summary is a cache with an expiry <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Prefer the current document over a month-old paraphrase <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

### Prompt files you can version in Git <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* The smoke test loads a file <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* A chat transcript is not the source of the prompt <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

#### Keep prompts next to code, not in a chat history <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* One task, one file: `prompts/classify.md` or `prompts/classify.json` <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Review the wording diff like code <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Model id and token count go in the test log, not in the prompt text <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Call, inspect, check the contract, change one thing <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

#### DSPy when prompts should be optimized, not hand-tuned forever <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* [DSPy](https://github.com/stanfordnlp/dspy) compiles prompts against a metric <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* [MIPROv2](https://dspy.ai/current/api/optimizers/MIPROv2/) and [GEPA](https://dspy.ai/current/api/optimizers/GEPA/overview/) search instructions <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Hold out examples; a tiny train set will look brilliant and lie <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Stay with a prompt file while the contract is still a sentence you can read <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

### Summary: Prompting, Context, and System Instructions <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* System or developer rules, user text behind a delimiter, contract in the smoke test <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* JSON prompts name the fields; structured outputs wait until types must hold <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Spend the window on this call; date every summary <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Prompt files in Git; [DSPy](https://dspy.ai/) when a metric has stalled <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Next loop: Coding Agents and Skills <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

## Coding Agents and Skills <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* A model in a loop with your repo: read, edit, run <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* One agent for a week, one skill you edit, one done check <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* A hook only when a written rule failed to run <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

### Pick a coding agent and stay with it for a week <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* Record the agent, the model id, and the task <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Done is a test, a small diff, or a page you opened <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

#### Cursor, Claude Code, Codex, and GitHub Copilot <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* [Cursor](https://cursor.com/): editor, [skills](https://cursor.com/docs/skills), [hooks](https://cursor.com/docs/hooks) <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* [Claude Code](https://github.com/anthropics/claude-code): terminal agent, `CLAUDE.md`, plugins <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* [Codex](https://github.com/openai/codex): OpenAI's agent, reads `AGENTS.md` <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* [GitHub Copilot](https://github.com/features/copilot): stay if the team is already on GitHub <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* If it cannot run the tests, fix that before you blame the model <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

#### Aider and OpenCode in the terminal <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* [Aider](https://github.com/Aider-AI/aider): repo map, edits, commits; you bring the model <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* [OpenCode](https://github.com/sst/opencode): terminal agent, `.opencode/` plugins, many providers <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* A commit plus a test command is the week's done check <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* A visual UI task still needs a browser check <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

#### What Continue was, and why you should not start a new project on it <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* [Continue](https://continue.dev/) was an open-source agent; Cursor acquired it <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* The [repo](https://github.com/continuedev/continue) is read-only; 2.0.0 was the final release <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Existing installs can stay pinned; new projects pick a maintained agent <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

### Agent Skills that change the default behavior <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* A folder the agent loads when the task matches <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* [Agent Skills](https://github.com/agentskills/agentskills): open format, name plus description first <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* A vague description means the skill never fires <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

#### SKILL.md as the skill file <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* `SKILL.md` frontmatter: `name` and `description` <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Optional `scripts/`, `references/`, and `assets/` <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Commit project skills under `.agents/skills/` or the agent's directory <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Home-directory skills stay on your machine <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* The body names the command to run <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

#### Install and adapt Skills for Real Engineers <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* [mattpocock/skills](https://github.com/mattpocock/skills): small workflows you can edit <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* A plugin updates itself; [skills.sh](https://www.skills.sh/) copies files you own <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Install one path per agent, or every skill appears twice <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Replace the test command with yours; delete skills you will not use <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

#### Grill, spec, tickets, TDD, and code review loops <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* Grill: a decision you can point at, before code <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* `to-spec` and `to-tickets`: one diff per ticket <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* `tdd`: the new test failed once, then passed <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Close with a review of the diff, not only the agent's summary <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* One loop per task; a one-line fix does not need all five <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

#### Cursor skills, Claude Code plugins, and the skills.sh installer <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* Cursor: `.cursor/skills/` or `.agents/skills/`, invoke with `/` <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Claude Code plugins update from a marketplace; uninstall before a hand-edited copy <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* `npx skills add` copies folders you can diff <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* After install, ask the agent to list the skills it can see <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

#### Anthropic skills and other public skill catalogs <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* [anthropics/skills](https://github.com/anthropics/skills) and the [skills.sh](https://www.skills.sh/) index <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Read `SKILL.md` before you install <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Pin a catalog skill in git when it changes how code is written <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* One new catalog skill this week <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

### Agent hooks <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* A script at a named point in the loop; the model does not opt in <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* [Cursor](https://cursor.com/docs/hooks): `.cursor/hooks.json` <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* [Claude Code](https://docs.anthropic.com/en/docs/claude-code/hooks): `.claude/settings.json` <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

#### Cursor hooks and Claude Code hooks <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* Prove the wiring with one hook you can see fail <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Commit project hooks; keep personal experiments in your home directory <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Exit code 2 blocks on both hosts <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Cursor can load Claude hook files: [third-party hooks](https://cursor.com/docs/reference/third-party-hooks) <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

#### When a hook beats a skill <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* Skill: judgment (grill, split tickets, review a diff) <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Hook: the step must happen (block a command, format, require the test run) <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* "Never commit secrets" in a skill is a wish; a failing tool call is a control <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

### Process packs versus small composable skills <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* A pack installs phases, roles, and directories <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* A small skill is one `SKILL.md` you can delete <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

#### Spec Kit, BMAD, and GSD: what they own and what they hide <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* [Spec Kit](https://github.com/github/spec-kit): constitution, specify, plan, tasks, implement <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* [BMAD](https://github.com/bmad-code-org/BMAD-METHOD): many roles; skill text is paid on every run <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

#### When a thin skill beats a full methodology <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* One sentence you will enforce this month belongs in a thin skill <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* A methodology needs an owner for the templates and a pin on upgrades <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

#### AGENTS.md, CLAUDE.md, and Cursor rules <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

## Structured Outputs and Tool Calling <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* The assertion is a validated object, or a failed run <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Structured output is the answer shape <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* A tool call is a request your code may run <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* A paragraph is not a fallback parser <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

### JSON you can trust <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* Required fields present, types match, enums stay inside the set <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Start with three fields and a fixture beside the schema <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

#### Native structured outputs from hosted APIs <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* JSON mode parses; a schema mode matches your fields <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* [OpenAI](https://developers.openai.com/api/docs/guides/structured-outputs): `text_format` or `json_schema`, plus a refusal you can branch on <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* [Anthropic](https://platform.claude.com/docs/en/build-with-claude/structured-outputs): JSON outputs and strict tool use <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* [Gemini](https://ai.google.dev/gemini-api/docs/structured-output): response schema; function calling is the action <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* A local server that cannot hold the schema does not get a weaker test <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

#### Instructor and Pydantic for validated objects <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* [Instructor](https://github.com/567-labs/instructor) returns a Pydantic model and retries with the validation error <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* One schema across OpenAI, Anthropic, Gemini, or an OpenAI-compatible local server <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Native schema mode first; Instructor when the retry or the second provider is the point <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* One validation step, and a log of the raw payload on failure <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

#### Outlines and BAML for constrained generation <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* [Outlines](https://github.com/dottxt-ai/outlines): mask invalid tokens on vLLM, llama.cpp, or Transformers <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* [BAML](https://github.com/boundaryml/baml): `.baml` contracts, a generated client, a tolerant parser <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* One constraint tool per repo so the schema cannot drift <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

### Function calling and tools <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* The model returns a name and arguments <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Your process runs the function, or refuses it, and sends the result back <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

#### OpenAI tools, Anthropic tool use, and Gemini function calling <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* Name, when to use it, and a schema for the arguments <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* [OpenAI](https://developers.openai.com/api/docs/guides/function-calling) tools, strict arguments <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* [Anthropic](https://platform.claude.com/docs/en/build-with-claude/structured-outputs) strict tool use; the result is a tool result block <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* [Gemini](https://ai.google.dev/gemini-api/docs/generate-content/function-calling) function declarations; your code still runs them <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Smoke test a stub: the name, the arguments, and the value you sent back <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

#### PydanticAI for typed Python agents <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* [PydanticAI](https://github.com/pydantic/pydantic-ai): tools and a final result that both validate <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* [Instructor](https://github.com/567-labs/instructor) for one extraction; PydanticAI when the loop has tools <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Log every tool call; types you cannot see in the log are decorative <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

#### Retries, validation errors, and refusing to parse prose <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* Two or three retries, each one carrying the validator's message <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Then fail the job and leave the record empty <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* No first-brace parser, no dumping the paragraph into a notes column <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* JSON mode is allowed only when that model has no schema mode, and the test says so <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

### When a spreadsheet or form is the real interface <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* The model is a function from messy text to a row <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Add a chat when a follow-up will not fit in the row <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

#### Extract, classify, and fill records from messy text <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* Extract only what is in the text; a missing amount stays null <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Classify into the enum you wrote, not a new label <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Your code writes the row after validation; the model never sees production credentials <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Three fixtures: happy path, missing field, a label that must not be guessed <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

### Summary: Structured Outputs and Tool Calling <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* Native schemas on [OpenAI](https://developers.openai.com/api/docs/guides/structured-outputs), [Anthropic](https://platform.claude.com/docs/en/build-with-claude/structured-outputs), and [Gemini](https://ai.google.dev/gemini-api/docs/structured-output) <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* [Instructor](https://github.com/567-labs/instructor), [Outlines](https://github.com/dottxt-ai/outlines), or [BAML](https://github.com/boundaryml/baml) for the constraint you actually need <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Tools run in your process; [PydanticAI](https://github.com/pydantic/pydantic-ai) when that loop is the product <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Fail closed; fill a sheet when a sheet is the interface <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Next loop: Retrieval-Augmented Generation (RAG) <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
