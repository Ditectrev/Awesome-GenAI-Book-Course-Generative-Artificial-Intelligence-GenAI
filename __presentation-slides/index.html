## Introduction to Generative AI (GenAI) <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

---

### What is Generative AI (GenAI)? <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* Generation, not lookup <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* A model is not a product <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Mix providers: [OpenAI](https://openai.com/), [Groq](https://groq.com/), [Ollama](https://ollama.com/) <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Products: [ChatGPT](https://chatgpt.com/), [Claude](https://claude.ai/), [Gemini](https://gemini.google.com/), [Le Chat](https://chat.mistral.ai/), [DeepSeek](https://www.deepseek.com/) <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

#### Tokens, context windows, and why they matter on the job <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* A token is the chunk the model actually sees <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Billed and limited in tokens, not words <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Count with the provider tokenizer, not `len(text)` <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* [tiktoken](https://github.com/openai/tiktoken) and the [OpenAI tokenizer](https://platform.openai.com/tokenizer) <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* [Claude token counting](https://docs.anthropic.com/en/docs/build-with-claude/token-counting) <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* [Gemini API](https://ai.google.dev/gemini-api/docs) count methods <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

#### Tokens, context windows, and why they matter on the job <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* Context window = system + retrieval + tools + history + reply <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* A bigger window is not free <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Durable rules in a system prompt, not every user turn <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Large documents behind retrieval, not pasted whole <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Measure prompt tokens and completion tokens separately <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Count tokens before you ship the prompt <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

#### Models, products, and open-weight checkpoints <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* A **model** is the trained network and tokenizer <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Hosted models: [OpenAI Platform](https://platform.openai.com/), [Anthropic Console](https://console.anthropic.com/), [Gemini API](https://ai.google.dev/gemini-api/docs), [Mistral AI](https://mistral.ai/), [DeepSeek API](https://api-docs.deepseek.com/) <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* A **product** wraps a model: [ChatGPT](https://chatgpt.com/), [Claude](https://claude.ai/), [Gemini](https://gemini.google.com/) <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* An **open-weight checkpoint** is a file of weights, usually from the [Hugging Face Hub](https://huggingface.co/models) <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Run with [Ollama](https://ollama.com/), [llama.cpp](https://github.com/ggml-org/llama.cpp), [vLLM](https://github.com/vllm-project/vllm), [Transformers](https://github.com/huggingface/transformers) <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Open weights are not automatically open source; read the [model card](https://huggingface.co/docs/hub/en/model-cards) <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Write down model id, product or API, and whether you can host it <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

#### Text, image, audio, and multimodal generation in practice <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* Text first: [OpenAI](https://platform.openai.com/docs/guides/text), [Anthropic](https://docs.anthropic.com/en/docs/build-with-claude/text-generation), [Gemini](https://ai.google.dev/gemini-api/docs), [Mistral](https://docs.mistral.ai/), [DeepSeek](https://api-docs.deepseek.com/) <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Images: [ChatGPT](https://chatgpt.com/), [OpenAI Images API](https://platform.openai.com/docs/guides/images), [Gemini image generation](https://ai.google.dev/gemini-api/docs/image-generation) <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Local images: [Diffusers](https://github.com/huggingface/diffusers), [ComfyUI](https://github.com/Comfy-Org/ComfyUI), [AUTOMATIC1111 WebUI](https://github.com/AUTOMATIC1111/stable-diffusion-webui), [Flux](https://blackforestlabs.ai/) <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Audio: [OpenAI Whisper](https://github.com/openai/whisper), [whisper.cpp](https://github.com/ggml-org/whisper.cpp), later [LiveKit Agents](https://github.com/livekit/agents) <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Multimodal: screenshot, PDF page, or photo plus a question <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Start with text; add other modalities as a second loop <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

### How generative models are trained <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* You do not train a frontier model to ship <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Stack: machine learning, pretraining, instruction tuning, preference data <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Fine-tuning stays under Shipping, Cost, and Operations <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

#### Machine learning basics you need on the job <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* Train versus serve: production is almost always inference <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Loss and generalization: demo success is not your tickets <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Supervision: next-token, instruction-response pairs, rankings <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Training is a build pipeline you rarely run <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

#### Pretraining, datasets, and data licenses <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* Pretraining is next-token prediction on a huge mix <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Read dataset and license on the [Hugging Face model card](https://huggingface.co/docs/hub/en/model-cards) <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Hosted terms: [OpenAI](https://openai.com/policies/row-privacy-policy/), [Anthropic](https://www.anthropic.com/legal/privacy), [Google Gemini](https://ai.google.dev/gemini-api/terms), [Mistral](https://mistral.ai/terms/), [DeepSeek](https://www.deepseek.com/) <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Do not train on customer tickets without a written right <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* If you are unsure, retrieval beats training <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

#### Hugging Face Datasets as a catalog <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* [Hugging Face Datasets](https://github.com/huggingface/datasets) library and [Hub catalog](https://huggingface.co/datasets) <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Find what a checkpoint already saw, or a close proxy <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Load an eval set before you invent one <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Read the license on the dataset card, not only the model card <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Prefer streaming and documented schemas <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* You need it for evals and adapters, not for a hosted API call <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

#### Instruction tuning, RLHF, and preference data <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* Instruction-tuned models follow "summarize this" and "return JSON" <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Preference data: rank answer A versus answer B <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* [RLHF](https://openai.com/index/instruction-following/) and [Constitutional AI](https://www.anthropic.com/research/constitutional-ai-harmlessness-from-ai-feedback) <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Open tooling: [Hugging Face TRL](https://github.com/huggingface/trl) <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Chat APIs are already instruction-tuned <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Preference tuning is not a knowledge-cutoff refresh <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

### When to use a hosted API versus a local model <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* Who runs the GPUs, who sees the bytes, who you page at 2 a.m. <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Hosted API: a URL, a key, and a bill <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Local: [Ollama](https://ollama.com/), [llama.cpp](https://github.com/ggml-org/llama.cpp), [Open WebUI](https://github.com/open-webui/open-webui), [vLLM](https://github.com/vllm-project/vllm) <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Default to a hosted API for the first working loop <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

#### Cost, privacy, latency, and lock-in tradeoffs <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* Cost: APIs per token; local in GPUs, electricity, and people <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Privacy: read training and retention terms; local is not a privacy program by itself <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Latency: measure time-to-first-token; [Groq](https://groq.com/) as a fast hosted path <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Lock-in: OpenAI-compatible servers with [Ollama](https://ollama.com/), [vLLM](https://github.com/vllm-project/vllm), [llama.cpp](https://github.com/ggml-org/llama.cpp) <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Prototype on a hosted API, freeze an interface, then decide <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

### One interface over many providers <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* Pick one adapter, not all three <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

#### LiteLLM as a unified API <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* [LiteLLM](https://github.com/BerriAI/litellm) and [LiteLLM docs](https://docs.litellm.ai/docs/) <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* OpenAI-shaped call; model string names the vendor <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Same smoke-test prompt, two model strings <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Proxy belongs in Shipping; the library is enough today <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

#### Vercel AI SDK for app UIs <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* [Vercel AI SDK](https://github.com/vercel/ai) and [ai-sdk.dev](https://ai-sdk.dev/) <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Stream tokens into a web app <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Keys stay on the server, never in the browser <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Skip it until a native non-streaming call already works <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

#### OpenRouter as a model router <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* [OpenRouter](https://openrouter.ai/) and [OpenRouter docs](https://openrouter.ai/docs) <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* One key, many origin models, OpenAI-compatible client <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Cap spend on OpenRouter itself <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Not a substitute for learning one native SDK <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

### Secrets, logging, and a daily working loop <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* Key in the environment <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Request logged in a form you can diff <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

#### Environment variables, never paste keys into chats <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* SDKs read `OPENAI_API_KEY`, `ANTHROPIC_API_KEY`, and friends <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Never paste a live key into [ChatGPT](https://chatgpt.com/), [Claude](https://claude.ai/), or a committed prompt file <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

## Local Models You Can Run Today <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* Weights on disk, plus a server you start <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

### Install a local runner in under an hour <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

#### Ollama for everyday local chat and APIs <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* Install from [Ollama](https://ollama.com/download) <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

* `ollama list` shows it; the server stays on port 11434 <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* OpenAI client: base URL `http://localhost:11434/v1/`, any non-empty `api_key` <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Local Ollama ignores that key <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

#### Ollama for everyday local chat and APIs <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* Same smoke-test prompt; `model` is the tag you pulled <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* [OpenAI compatibility](https://docs.ollama.com/api/openai-compatibility): chat, JSON, tools <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* `tool_choice` and logprobs are outside that subset <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* `ollama signin` and `OLLAMA_API_KEY` are the cloud path <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

#### llama.cpp and GGUF when you need control <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* `llama cli -hf` runs a Hub GGUF <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* `llama serve -hf` opens the OpenAI-compatible server <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* [Server README](https://github.com/ggml-org/llama.cpp/blob/master/tools/server/README.md): port 8080 <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

#### Open WebUI as a local ChatGPT-style front end <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* [Open WebUI](https://github.com/open-webui/open-webui) is a chat UI, not a model <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

* Chats live in the data volume; local weights do not erase that log <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

## Prompting, Context, and System Instructions <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* The smoke test grows from "pong" into a contract <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Rules, task, evidence, and output shape <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* The prompt lives in a file, not in a chat <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

### Write instructions the model can follow <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* The model sees the text, in order, inside the window <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* If a colleague would hesitate, the model will too <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* One change per rerun <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

#### System prompts <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* Durable rules: job, constraints, output shape, missing input <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* [Anthropic](https://docs.anthropic.com/en/docs/build-with-claude/prompt-engineering/system-prompts): top-level `system` <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* [Gemini](https://ai.google.dev/gemini-api/docs/text-generation): `system_instruction` <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* [OpenAI](https://developers.openai.com/api/reference/resources/chat): `developer` message or Responses `instructions` <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Short enough to read in one screen; prove the missing-input rule with a fixture <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

#### System, developer, and user roles <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* User text is the task and the document; treat customer text as data <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Assistant turns are history, unless you meant a few-shot example <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* [OpenAI Model Spec](https://model-spec.openai.com/): developer instructions outrank user text <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* From o1 on, `developer` replaces `system` <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Local templates only honor a system slot when the checkpoint has one <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

#### Splitting work, delimiters, and output contracts <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* One request, one job <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Name the fence and wrap the payload: XML tags or Markdown headings, one style <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Long document first, question last; rules stay in the instruction slot <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* The contract is the assertion in words, then in the smoke test <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

#### Few-shot examples that help instead of confuse <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* A few input/output pairs when the format is easier to show <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Every example must obey the contract <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Cover an edge you actually hit <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* A pile of examples is an eval set, not a prompt <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

### JSON prompts <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* The instruction itself is an object: task, rules, output, input <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* "Reply in JSON" is a separate decision about the answer <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

#### Write the prompt as JSON, not only the answer <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* Named fields diff cleanly <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Keep `task` and `rules` stable; vary `input` from a fixture <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Commit fake input; keep customer text and secrets out of Git <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Parse the answer with a strict parser <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

#### When JSON prompts are enough versus structured outputs <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* Enough when a person could check a small object and a retry is acceptable <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Move on when a program must trust types <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* JSON mode stops preamble; it does not enforce your schema <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Next chapter: Structured Outputs and Tool Calling <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

### Context windows as a budget <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* Instructions, history, documents, tools, and the reply share one window <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Log prompt tokens on every smoke test <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

#### What to put in the prompt versus retrieve later <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* Keep rules, this task, and the one document that must be seen whole <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* A wiki, a pile of PDFs, or a repo dump waits for retrieval or tools <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Stable instructions first so a prompt cache can reuse the prefix <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* [Anthropic prompt caching](https://docs.anthropic.com/en/docs/build-with-claude/prompt-caching): tools, then system, then messages <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

#### Summaries, memory notes, and stale context <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* Trim history on purpose; confirm the system prompt is still in the request <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* A memory note is decisions, names, and constraints, with a date <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* A summary is a cache with an expiry <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Prefer the current document over a month-old paraphrase <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

### Prompt files you can version in Git <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* The smoke test loads a file <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* A chat transcript is not the source of the prompt <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

#### Keep prompts next to code, not in a chat history <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* One task, one file: `prompts/classify.md` or `prompts/classify.json` <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Review the wording diff like code <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Model id and token count go in the test log, not in the prompt text <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Call, inspect, check the contract, change one thing <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

#### DSPy when prompts should be optimized, not hand-tuned forever <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* [DSPy](https://github.com/stanfordnlp/dspy) compiles prompts against a metric <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* [MIPROv2](https://dspy.ai/current/api/optimizers/MIPROv2/) and [GEPA](https://dspy.ai/current/api/optimizers/GEPA/overview/) search instructions <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Hold out examples; a tiny train set will look brilliant and lie <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Stay with a prompt file while the contract is still a sentence you can read <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

### Summary: Prompting, Context, and System Instructions <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* System or developer rules, user text behind a delimiter, contract in the smoke test <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* JSON prompts name the fields; structured outputs wait until types must hold <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Spend the window on this call; date every summary <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Prompt files in Git; [DSPy](https://dspy.ai/) when a metric has stalled <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Next loop: Coding Agents and Skills <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

## Coding Agents and Skills <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* A model in a loop with your repo: read, edit, run <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* One agent for a week, one skill you edit, one done check <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* A hook only when a written rule failed to run <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

### Pick a coding agent and stay with it for a week <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* Record the agent, the model id, and the task <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Done is a test, a small diff, or a page you opened <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

#### Cursor, Claude Code, Codex, and GitHub Copilot <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* [Cursor](https://cursor.com/): editor, [skills](https://cursor.com/docs/skills), [hooks](https://cursor.com/docs/hooks) <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* [Claude Code](https://github.com/anthropics/claude-code): terminal agent, `CLAUDE.md`, plugins <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* [Codex](https://github.com/openai/codex): OpenAI's agent, reads `AGENTS.md` <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* [GitHub Copilot](https://github.com/features/copilot): stay if the team is already on GitHub <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* If it cannot run the tests, fix that before you blame the model <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

#### Aider and OpenCode in the terminal <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* [Aider](https://github.com/Aider-AI/aider): repo map, edits, commits; you bring the model <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

## Structured Outputs and Tool Calling <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* The assertion is a validated object, or a failed run <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Structured output is the answer shape <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* A tool call is a request your code may run <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* A paragraph is not a fallback parser <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

### JSON you can trust <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* Required fields present, types match, enums stay inside the set <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Start with three fields and a fixture beside the schema <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

#### Native structured outputs from hosted APIs <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* JSON mode parses; a schema mode matches your fields <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* [OpenAI](https://developers.openai.com/api/docs/guides/structured-outputs): `text_format` or `json_schema`, plus a refusal you can branch on <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* [Anthropic](https://platform.claude.com/docs/en/build-with-claude/structured-outputs): JSON outputs and strict tool use <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* [Gemini](https://ai.google.dev/gemini-api/docs/structured-output): response schema; function calling is the action <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* A local server that cannot hold the schema does not get a weaker test <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

#### Instructor and Pydantic for validated objects <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* [Instructor](https://github.com/567-labs/instructor) returns a Pydantic model and retries with the validation error <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* One schema across OpenAI, Anthropic, Gemini, or an OpenAI-compatible local server <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Native schema mode first; Instructor when the retry or the second provider is the point <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* One validation step, and a log of the raw payload on failure <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

#### Outlines and BAML for constrained generation <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* [Outlines](https://github.com/dottxt-ai/outlines): mask invalid tokens on vLLM, llama.cpp, or Transformers <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* [BAML](https://github.com/boundaryml/baml): `.baml` contracts, a generated client, a tolerant parser <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* One constraint tool per repo so the schema cannot drift <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

### Function calling and tools <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* The model returns a name and arguments <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Your process runs the function, or refuses it, and sends the result back <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

#### OpenAI tools, Anthropic tool use, and Gemini function calling <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* Name, when to use it, and a schema for the arguments <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* [OpenAI](https://developers.openai.com/api/docs/guides/function-calling) tools, strict arguments <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* [Anthropic](https://platform.claude.com/docs/en/build-with-claude/structured-outputs) strict tool use; the result is a tool result block <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* [Gemini](https://ai.google.dev/gemini-api/docs/generate-content/function-calling) function declarations; your code still runs them <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Smoke test a stub: the name, the arguments, and the value you sent back <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

#### PydanticAI for typed Python agents <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* [PydanticAI](https://github.com/pydantic/pydantic-ai): tools and a final result that both validate <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* [Instructor](https://github.com/567-labs/instructor) for one extraction; PydanticAI when the loop has tools <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Log every tool call; types you cannot see in the log are decorative <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

#### Retries, validation errors, and refusing to parse prose <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* Two or three retries, each one carrying the validator's message <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Then fail the job and leave the record empty <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* No first-brace parser, no dumping the paragraph into a notes column <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* JSON mode is allowed only when that model has no schema mode, and the test says so <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

### When a spreadsheet or form is the real interface <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* The model is a function from messy text to a row <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Add a chat when a follow-up will not fit in the row <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

#### Extract, classify, and fill records from messy text <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* Extract only what is in the text; a missing amount stays null <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Classify into the enum you wrote, not a new label <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Your code writes the row after validation; the model never sees production credentials <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Three fixtures: happy path, missing field, a label that must not be guessed <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

### Summary: Structured Outputs and Tool Calling <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* Native schemas on [OpenAI](https://developers.openai.com/api/docs/guides/structured-outputs), [Anthropic](https://platform.claude.com/docs/en/build-with-claude/structured-outputs), and [Gemini](https://ai.google.dev/gemini-api/docs/structured-output) <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* [Instructor](https://github.com/567-labs/instructor), [Outlines](https://github.com/dottxt-ai/outlines), or [BAML](https://github.com/boundaryml/baml) for the constraint you actually need <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Tools run in your process; [PydanticAI](https://github.com/pydantic/pydantic-ai) when that loop is the product <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Fail closed; fill a sheet when a sheet is the interface <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Next loop: Retrieval-Augmented Generation (RAG) <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

## Retrieval-Augmented Generation (RAG) <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* Fetch a few passages, then ask the model to answer from them <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Print the passages before you grade the prose <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Five questions, each with a file and a quote you can point at <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

### The working RAG loop <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* Ingest, chunk, embed, retrieve, generate <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* One embedding model per index; rebuild when it changes <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* The prompt stays put until the right chunk is in the list <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

#### Ingest, chunk, embed, retrieve, generate <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* Chunk on headings, pages, and rows; keep source, page, and heading <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Retrieve a small k and print the chunks <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* The answer names a source you actually passed in <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* If the chunks lack the answer, the model says so <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

#### When RAG is the wrong fix <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* A format or a schema is a prompt, not a corpus <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* A calculation or a write is a tool <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* A repo change is a coding agent with a test command <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Relationships across the set may need a graph, not a finer chunk <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* No named source file means you are not ready to index <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

### Ingest documents you actually have <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* Read three extracted pages before you embed the folder <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Headers, footers, and flattened tables become confident wrong answers <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

#### Unstructured and Docling for PDFs and office files <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* [Unstructured](https://github.com/Unstructured-IO/unstructured): mixed files into titled elements and tables <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* [Docling](https://github.com/docling-project/docling): layout-aware PDF, DOCX, PPTX, HTML <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* One parser; add a second only when the first drops the table you need <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

#### Firecrawl and Crawl4AI for websites <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* [Firecrawl](https://github.com/mendableai/firecrawl): hosted crawl to markdown, with the URL and the fetch time <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* [Crawl4AI](https://github.com/unclecode/crawl4ai): the crawler you run when pages cannot leave <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* A seed, a depth, an allowlist of domains; then the same chunk and embed steps <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

### Indexes and vector stores <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* One framework and one store for the week <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* The framework loads and calls; the store keeps vectors and metadata <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

#### LlamaIndex as a data framework <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* [LlamaIndex](https://github.com/run-llama/llama_index): load, chunk, embed, retrieve, synthesize <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* A script you can rerun, and an index directory you can delete <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* After every rebuild, compare chunk ids on the same five questions <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

#### LangChain retrievers and loaders <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* [LangChain](https://github.com/langchain-ai/langchain): loaders and a retriever that returns documents <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Log the documents; a chain that only prints the answer skips the test <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* LangChain or LlamaIndex for the week, not both <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

#### Haystack pipelines <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* [Haystack](https://github.com/deepset-ai/haystack): each stage is a node you can swap <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Worth it when two people will edit the stages <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* The five questions are still the smoke test <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

#### Chroma, Qdrant, Weaviate, and Milvus <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* [Chroma](https://github.com/chroma-core/chroma): laptop directory, first store <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* [Qdrant](https://github.com/qdrant/qdrant): a server and payload filters <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* [Weaviate](https://github.com/weaviate/weaviate): hybrid query when codes and names must match <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* [Milvus](https://github.com/milvus-io/milvus): when one node is no longer the corpus <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Record collection, embedding model, and distance; rerun after every rebuild <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

### Search that does not embarrass you <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* Print the chunks; shared vocabulary is not the right passage <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Fix search before you touch the prompt <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

#### Hybrid search, rerankers, and citations <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* Keywords for exact tokens, vectors for paraphrases <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* A reranker reorders candidates; it cannot retrieve a chunk the first pass missed <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Citations may only name chunks you passed in <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Show the passage under the citation <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

#### Microsoft GraphRAG when relationships matter <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* [GraphRAG](https://github.com/microsoft/graphrag): entities, communities, and summaries <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Use it when one true paragraph still misses the edge between pieces <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Extraction over the corpus happens before the first question <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Start on chunks; add the graph when you can show the question chunks fail <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

#### Evaluating retrieval before you tune the prompt <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* For each question: did the expected quote appear, and at what rank <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Absent quote: change the index; buried quote: change k or rerank <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Edit the prompt only when the quote is already in the context <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* A five-row yes/no sheet is the harness until the corpus grows <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

### Summary: Retrieval-Augmented Generation (RAG) <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* Ingest with [Docling](https://github.com/docling-project/docling) or [Unstructured](https://github.com/Unstructured-IO/unstructured); crawl with [Firecrawl](https://github.com/mendableai/firecrawl) or [Crawl4AI](https://github.com/unclecode/crawl4ai) <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

* [GraphRAG](https://github.com/microsoft/graphrag) when relationships are the question <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Next loop: Agents and Multi-Step Workflows <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

## Agents and Multi-Step Workflows <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* A loop with tools, a trace, and a step cap <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Two tools you already trust: retrieval, and one stub <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* The personality in the prompt is not the agent <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

### An agent is a loop with tools, not a personality <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* Reply, or a tool call your code runs <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Stop on a valid result, a step cap, a tool error, or a human <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Log the tool name, the arguments, the observation, and why you stopped <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

#### Plan, act, observe, stop <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* Plan: one next action you can store in the log <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Act: one tool call; your process holds the credentials <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Observe: the raw result, not a paraphrase <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Stop: a third step on a one-step fixture is a failure <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

#### Human approval gates you should not skip <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* Pause in the framework before send, pay, delete, or push <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* "Ask me first" in the prompt is not a gate <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Show the tool name, the arguments, and the trace so far <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Resume from a checkpoint; do not restart the chat <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

### Frameworks you can ship with <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* One framework for the week <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Same fixture, same two tools, same step cap, same trace <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

#### LangGraph for stateful graphs and checkpoints <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* [LangGraph](https://github.com/langchain-ai/langgraph): nodes, edges, and a checkpointer <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Kill the process and resume; that is the feature you picked <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

#### OpenAI Agents SDK <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* [OpenAI Agents SDK](https://github.com/openai/openai-agents-python): instructions, tools, handoffs, a runner <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* The SDK runs in your process; the hosted Agents API is a different deployment <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* A handoff is another place to log, not a reason to drop the step cap <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

#### CrewAI crews and flows <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* [CrewAI](https://github.com/crewAIInc/crewAI): a crew of roles inside a flow that keeps the order <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* One agent and one flow until the trace shows a step worth isolating <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

#### Microsoft Agent Framework after AutoGen <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* [Microsoft Agent Framework](https://github.com/microsoft/agent-framework): new Python and .NET agent work <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* [AutoGen](https://github.com/microsoft/autogen) stays for existing apps; new services move <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* A chat between two agents is not the smoke test <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

#### Hugging Face smolagents <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* [smolagents](https://github.com/huggingface/smolagents): actions as Python, or as JSON tool calls <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Run the code in a sandbox, and show the code in the trace <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

#### Mastra as a TypeScript agent framework <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* [Mastra](https://github.com/mastra-ai/mastra): agents and workflows in a TypeScript app <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Suspend is the human gate; a test asserts the trace <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

### Browser, computer, and workflow agents <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* The observation is a page, a screenshot, or a node that ran <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* One origin, a step cap, and an assertion a human would trust <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

#### Playwright-based browsing and Stagehand <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* [Playwright](https://playwright.dev/) when you know the selectors <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* [Stagehand](https://github.com/browserbase/stagehand) when the selector is the fragile part <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Prefer the script when the script can do the task <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

#### n8n, Dify, Flowise, and Langflow when you want a canvas <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* [n8n](https://github.com/n8n-io/n8n): the agent is one node in a business workflow <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* [Dify](https://github.com/langgenius/dify): an app builder an operator can edit <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* [Flowise](https://github.com/FlowiseAI/Flowise) and [Langflow](https://github.com/langflow-ai/langflow): drag the path, then run it <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* The run's output is the test; a picture of the canvas is not <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

### Memory engineering <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* Memory is what the next step is allowed to see <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Documents stay in the RAG index; this section is the policy beside it <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

#### What to store, what to forget, and what to retrieve <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* Store a decision, a stable preference, or an expensive result, with a date <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Forget secrets, contradicted facts, and payloads you can fetch again <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Retrieve at the step that needs the fact; do not paste the store into every turn <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

#### Working memory versus long-term memory <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* Working memory is this run: plan, tool results, steps left <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Long-term memory is small, dated, and queried after the run ends <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* A checkpoint resumes a run; it is not a knowledge base <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

#### Mem0, Letta, and Graphiti as starting points <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* A dated table is enough until you are about to invent one badly <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* [Mem0](https://github.com/mem0ai/mem0): extract and search memories; review what it stored <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* [Letta](https://github.com/letta-ai/letta): the agent edits memory blocks inside a budget <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* [Graphiti](https://github.com/getzep/graphiti): facts that change over time, as a graph <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Two fixtures: recall a fact in a new session, and return the newer fact when one was superseded <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

### Summary: Agents and Multi-Step Workflows <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* Trace plan, act, observe, stop; gate side effects <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* One of [LangGraph](https://github.com/langchain-ai/langgraph), the [OpenAI Agents SDK](https://github.com/openai/openai-agents-python), [CrewAI](https://github.com/crewAIInc/crewAI), [Agent Framework](https://github.com/microsoft/agent-framework), [smolagents](https://github.com/huggingface/smolagents), or [Mastra](https://github.com/mastra-ai/mastra) <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* [Playwright](https://playwright.dev/) or [Stagehand](https://github.com/browserbase/stagehand) on one origin; a canvas only if the run is the test <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Working memory in the run; long-term memory dated and retrieved <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Next loop: Model Context Protocol (MCP) <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

## Model Context Protocol (MCP) <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* One tool catalog that Cursor, Claude, and Copilot can share <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Tools, resources, and prompts, kept distinct <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* The server runs the tool; the model only asks <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

### What MCP is for <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* A function used by one script can stay a function <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* MCP is the adapter when a second client needs the same capability <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* The server's permissions are the blast radius <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

#### Tools, resources, and prompts as a standard <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* Tools act; the description decides when the model calls them <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Resources are data the client reads, addressed by a URI <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Prompts are templates the client fills in <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Spec revision [2026-07-28](https://blog.modelcontextprotocol.io/posts/2026-07-28/): stateless requests, header routing <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* stdio on your machine first; Streamable HTTP only with auth <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

#### Clients you already use: Claude, Cursor, and Copilot <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* [Claude Code](https://docs.anthropic.com/en/docs/claude-code/mcp): a command or a URL in the MCP config <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* [Cursor](https://cursor.com/docs/mcp): project config in the repo, secrets in user config <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* [Copilot](https://docs.github.com/en/copilot): same catalog, same visible tool call <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* First connection: the filesystem reference server, one directory <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

### Run official and community servers <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* A community server is code that runs as you <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Read the tool list; enable one server this week <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

#### The MCP specification and reference servers <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* [Specification](https://github.com/modelcontextprotocol/specification) on [modelcontextprotocol.io](https://modelcontextprotocol.io/) <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Tier 1 SDKs track the revision: TypeScript, Python, Go, C# <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* [Reference servers](https://github.com/modelcontextprotocol/servers): filesystem pointed at a fixture folder <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* A path you did not allow must be refused <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

#### Python SDK and TypeScript SDK <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* [Python SDK](https://github.com/modelcontextprotocol/python-sdk) v2: `MCPServer`, typed tools, docstring as the description <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* v1's `FastMCP` moved; follow the [migration notes](https://py.sdk.modelcontextprotocol.io/whats-new/) <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* [TypeScript SDK](https://github.com/modelcontextprotocol/typescript-sdk) v2: `@modelcontextprotocol/server` and `@modelcontextprotocol/client` <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* An add-two-numbers tool proves the transport, not your stack <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

### Write a small MCP server for your own stack <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* Wrap a function that already has a test <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Read-only and narrow: a ticket id, or the retrieval function you already score <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

#### Expose one internal API as tools <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* Verb name, a description that says when not to call it, a strict argument schema <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Map errors to tool errors; do not swallow them into a cheerful string <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Fixture id returns the fixture status; a missing id is rejected <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Log tool name, ids, latency, and whether the call was allowed <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

#### Auth, allowlists, and the blast radius of a tool <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* Enable only the tool under test <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Ids from retrieved text are untrusted until your policy accepts them <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* stdio inherits your user; do not point a filesystem server at your home directory <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* A remote server needs authorization; `Mcp-Name` lets a gateway deny a tool <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Writes wait for the same human gate as any other side effect <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

### Summary: Model Context Protocol (MCP) <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* [Spec](https://modelcontextprotocol.io/) 2026-07-28; one [reference server](https://github.com/modelcontextprotocol/servers) in a client you already use <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Your server is one read-only function, on the [Python](https://github.com/modelcontextprotocol/python-sdk) or [TypeScript](https://github.com/modelcontextprotocol/typescript-sdk) v2 SDK <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Allowlist the tool and the data; stdio is you; HTTP needs an identity <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Next loop: Harness engineering <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

## Harness engineering <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* The software around the model, not the model you rent <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* A trace plus a pass/fail, not an architecture diagram <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

### What a harness is <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* Take a task, call a model, act through tools, return an outcome you can score <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* If you cannot say what done is, you are collecting settings <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

#### The loop around the model: tools, sandbox, permissions, context compaction, and retries <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* Tools: an allowlist; a tool off the list cannot run <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Sandbox: workspace, filesystem, and network are the boundary <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Permissions live in code, a hook, or the product's approval UI <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Compaction drops bulk on purpose and keeps the rules plus the latest observation <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* A retry includes the error; a cap ends the run; a denial is not a retry <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

#### Runtime harness versus eval harness <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* Runtime: credentials, sandbox, logs, a way to stop, a user today <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Eval: a frozen task, a check, no production write access <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* "The model says it did well" is a second prompt, not a score <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

### Use Cursor, Claude Code, or Codex before you build one <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* Stay until you can name the control the product will not give you <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

#### What those products already run for you <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* [Cursor](https://cursor.com/): rules, skills, hooks, MCP, and an approval step <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* [Claude Code](https://github.com/anthropics/claude-code): permissions, hooks, MCP, compaction <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* [Codex](https://github.com/openai/codex): sandbox modes and approvals on a repo you control <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* One task, one test, a note of which permission it asked for <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

#### When a product harness is no longer enough <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* A service, a tenant, and an audit log the product cannot host <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* A sandbox that must not hold the laptop's credentials <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* The same tool in every client is an MCP server, not a new loop <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* A hundred tasks overnight is an eval harness, which can still call the product <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

### Build or extend the runtime loop <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* Add the missing control to a loop you already trust <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* The trace shows the new control firing <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

#### Tools, MCP, and allowlists <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* The server may offer twenty tools; this run enables two <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Name them in config you commit <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Read-only first; a write waits for approval <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

#### Sandbox and permissions so a tool cannot wipe the repo <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* A workspace copy, not your real repo, until the patch is reviewed <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Network and credentials are deny-by-default <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* A fixture that asks for a delete must fail closed, in the trace <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

#### Context compaction when the window fills <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* Replace old tool output with what was called, what id came back, what failed <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Keep the rules, the task, and the latest observation <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Log tokens before and after; a worse next turn means the summary dropped a fact <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

#### Retries, stop conditions, and human approval <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* Stop on a step cap, a spend cap, a passing test, two identical errors, or a denial <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Retry a timeout with the error in the next observation <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Approval stores the pending call and waits; the model does not grant it <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

### Open harnesses you can actually clone <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* Clone a harness that already has a sandbox and a trace <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Read one run before you fork the prompts <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

#### Codex CLI, OpenHands, and SWE-agent <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* [Codex CLI](https://github.com/openai/codex): headless, with sandbox and approval modes <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* [OpenHands](https://github.com/OpenHands/OpenHands): an agent service you can host, one sandbox per task <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* [SWE-agent](https://github.com/SWE-agent/SWE-agent): issue in, patch out, tests as the check <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* A patch that passes and rewrites unrelated files still fails review <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

#### E2B for isolated sandboxes <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* [E2B](https://github.com/e2b-dev/E2B): a clean machine per task, then destroy it <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* The missing control is isolation, not a new planner <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Pull the diff and the test log; a reused sandbox is a shared computer <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

### Eval harnesses that score the loop <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* Pin the harness version, the model id, and the task list <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* A score without those three is a demo <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

#### SWE-bench and Inspect <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* [SWE-bench](https://github.com/SWE-bench/SWE-bench): a pinned repo, a patch, tests pass or they do not <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Five bugs from your own history before a public leaderboard <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* [Inspect](https://github.com/UKGovernmentBEIS/inspect_ai): tasks, a solver, a sandbox, a scorer <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Prefer a test or a schema check over a second model's opinion <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

#### promptfoo when the job is prompts, not a repo patch <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* [promptfoo](https://github.com/promptfoo/promptfoo): prompts, models, assertions, a failed run <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Schema fixtures and the five retrieval questions fit here <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* A coding agent is scored by the repo's tests, not by a prompt grade <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

### Summary: Harness engineering <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* Tools, sandbox, permissions, compaction, retries, and a stop you can defend <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
